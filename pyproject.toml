[project]
name = "gaia"
version = "0.1.0"
description = "Persistent Unbounded Multi-Race AI Civilization Engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "duckdb>=1.0.0",
    "rich>=13.7.0",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["llama.cpp", ".venv", "godot_client"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.pyright]
include = ["sim_core", "tests", "scripts"]
exclude = ["llama.cpp", ".venv", "godot_client"]
extraPaths = ["."]

[tool.pyrefly]
project-includes = [
    "sim_core",
    "tests",
    "scripts",
]
project-excludes = [
    "llama.cpp",
    ".venv",
    "godot_client",
]
search-path = ["."]
infer-with-first-use = false
